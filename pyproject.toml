[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibechek"
version = "0.4.0b9"
description = "ML-powered DJ library organizer — analyze, tag, and organize music collections"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "papapew" }]
keywords = ["dj", "music", "rekordbox", "essentia", "ml", "audio-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "mutagen>=1.47",
    "click>=8.1",
    "rich>=13.7",
    "platformdirs>=4.2",
    "psutil>=5.9",
    # TOML write support — tomllib is stdlib for reads only
    "tomli-w>=1.0",
    # `tomllib` (stdlib TOML reader) only exists on Python 3.11+. On 3.10 we
    # need `tomli` (the third-party backport that became stdlib `tomllib`).
    # Used only on the legacy-config-migration path; no perf or surface impact.
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
# Heavy ML dependency; installed separately because of platform/CUDA caveats.
# Install with: pip install vibechek[ml]
ml = [
    "essentia-tensorflow>=2.1b6.dev1110; platform_system != 'Windows'",
]
# ONNX Runtime inference engine (experimental, TF-free). Runs the SAME models
# through onnxruntime on PLAIN essentia (no bundled TensorFlow) — validated to
# parity with the [ml] path (docs/ONNX_MIGRATION.md). The desktop app provisions
# a separate ~/.vibechek/venv-onnx with these. For CLI / manual installs:
#   pip install vibechek[onnx]                         # CPU (works everywhere)
#   pip install vibechek[onnx] && pip install onnxruntime-gpu       # NVIDIA / AMD-ROCm
#   pip install vibechek[onnx] && pip install onnxruntime-directml  # Windows any-vendor GPU
# (onnxruntime-gpu / -directml REPLACE the CPU onnxruntime — install one, not both.)
onnx = [
    "essentia>=2.1b6.dev1110; platform_system != 'Windows'",
    "onnxruntime>=1.17",
]
# FLAC→CDJ export: soundfile (libsndfile) does the sample-accurate FLAC→AIFF
# transcode. Optional and gated at import time inside vibechek/cdj_export.py —
# if it's absent the tool falls back to an ffmpeg subprocess.
# Install with: pip install vibechek[cdj]
cdj = [
    "soundfile>=0.12",
]
# Dev / tests
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    # numpy is a real (lazily-imported) dependency of the analysis code; the ML
    # extras pull it transitively, but the pure-logic tests (ONNX patch math,
    # direction/BPM, etc.) need it directly. Declared here so CI's `[dev]`-only
    # install can run those tests instead of erroring at collection.
    "numpy>=1.24",
]

[project.scripts]
vibechek = "vibechek.cli:main"

[project.urls]
Homepage = "https://github.com/papapew/Vibechek"
Issues = "https://github.com/papapew/Vibechek/issues"
Documentation = "https://github.com/papapew/Vibechek/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["vibechek"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# E501: line length (handled by formatter / not worth churning).
# E402: module-import-not-at-top — the codebase deliberately uses lazy/
#   conditional imports (optional deps, heavy modules imported inside the
#   function that needs them) and places a few helpers above local imports.
# E702: multiple-statements-on-one-line — used intentionally in compact test
#   fixture builders. Bug-class rules (F) and bugbear (B) stay fully enforced.
ignore = ["E501", "E402", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
