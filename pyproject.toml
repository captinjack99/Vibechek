[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibechek"
version = "0.8.0b0"
description = "ML-powered DJ library organizer — analyze, tag, and organize music collections"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "papapew" }]
keywords = ["dj", "music", "rekordbox", "essentia", "ml", "audio-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "mutagen>=1.47",
    "click>=8.1",
    "rich>=13.7",
    "platformdirs>=4.2",
    "psutil>=5.9",
    # The dedupe "Trash duplicates" action ships in the frozen GUI, so this
    # must be a REAL dependency — a user cannot pip-install into the packaged
    # exe (as an optional import, the shipped action could only ever error).
    # Pure-python, tiny, cross-platform.
    "send2trash>=1.8",
    # TOML write support — tomllib is stdlib for reads only
    "tomli-w>=1.0",
    # `tomllib` (stdlib TOML reader) only exists on Python 3.11+. On 3.10 we
    # need `tomli` (the third-party backport that became stdlib `tomllib`).
    # Used only on the legacy-config-migration path; no perf or surface impact.
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
# Heavy ML dependency; installed separately because of platform/CUDA caveats.
# Install with: pip install vibechek[ml]
ml = [
    "essentia-tensorflow>=2.1b6.dev1110; platform_system != 'Windows'",
]
# ONNX Runtime inference engine (opt-in, TF-free; default stays essentia_tf).
# Runs the SAME models
# through onnxruntime on PLAIN essentia (no bundled TensorFlow) — validated to
# parity with the [ml] path (docs/ONNX_MIGRATION.md). The desktop app provisions
# a separate ~/.vibechek/venv-onnx and auto-picks the GPU stack when an NVIDIA
# GPU is present. For CLI / manual installs:
#   pip install vibechek[onnx]       # CPU (works everywhere)
#   pip install vibechek[onnx-gpu]   # NVIDIA CUDA (validated: backbone runs on CUDA)
# The CUDA libs ship as the nvidia-*-cu12 wheels and are loaded at runtime via
# onnxruntime.preload_dlls() (needs onnxruntime-gpu >= 1.19) — no system CUDA
# toolkit / LD_LIBRARY_PATH required.
onnx = [
    "essentia>=2.1b6.dev1110; platform_system != 'Windows'",
    "onnxruntime>=1.17",
]
onnx-gpu = [
    "essentia>=2.1b6.dev1110; platform_system != 'Windows'",
    "onnxruntime-gpu>=1.19",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-cuda-nvrtc-cu12",
]
# FLAC→CDJ export: soundfile (libsndfile) does the sample-accurate FLAC→AIFF
# transcode. Optional and gated at import time inside vibechek/cdj_export.py —
# if it's absent the tool falls back to an ffmpeg subprocess.
# Install with: pip install vibechek[cdj]
cdj = [
    "soundfile>=0.12",
]
# Pure-audio CLAP genre student (opt-in, heavy). The 2.2 GB checkpoint is NOT a
# pip dep — the in-app CLAP setup downloads it. Install with: pip install vibechek[clap]
clap = [
    "laion-clap>=1.1.6",
    "torch>=2.0",
    "torchvision>=0.15",
    "soundfile>=0.12",
]
# Online web-synthesis genre resolver (opt-in). ddgs is the runtime dep; the
# local LLM (Ollama) is installed by the in-app resolver setup, which also
# needs zstandard (to unpack the Ollama release tarball) — declared here so the
# manual install path matches the one-click setup exactly.
resolver = [
    "ddgs>=6.0",
    "zstandard>=0.22",
]
# Native (essentia-free / WSL-free) decode for the Windows analyze path. soundfile
# (libsndfile, native win_amd64 wheel) decodes WAV/FLAC/OGG/MP3; soxr does the
# band-limited resampling. Pairs with [onnx] (NumPy mel frontend + ONNX backbone)
# to run the genre/mood/vocal pipeline with zero essentia; an optional system
# ffmpeg is the fallback for codecs/files libsndfile can't open. Default analyze
# path is unchanged until the full gold-corpus parity gate is run.
native = [
    "soundfile>=0.12",
    "soxr>=0.3",
]
# Dev / tests
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    # numpy is a real (lazily-imported) dependency of the analysis code; the ML
    # extras pull it transitively, but the pure-logic tests (ONNX patch math,
    # direction/BPM, etc.) need it directly. Declared here so CI's `[dev]`-only
    # install can run those tests instead of erroring at collection.
    "numpy>=1.24",
    # The native-decode + numpy-frontend tests need these at CI time (the native
    # path's runtime deps). Small pure/native wheels — safe in the dev install.
    "soundfile>=0.12",
    "soxr>=0.3",
]

[project.scripts]
vibechek = "vibechek.cli:main"

[project.urls]
Homepage = "https://github.com/captinjack99/Vibechek"
Issues = "https://github.com/captinjack99/Vibechek/issues"
Documentation = "https://github.com/captinjack99/Vibechek/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["vibechek"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# E501: line length (handled by formatter / not worth churning).
# E402: module-import-not-at-top — the codebase deliberately uses lazy/
#   conditional imports (optional deps, heavy modules imported inside the
#   function that needs them) and places a few helpers above local imports.
# E702: multiple-statements-on-one-line — used intentionally in compact test
#   fixture builders. Bug-class rules (F) and bugbear (B) stay fully enforced.
ignore = ["E501", "E402", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
