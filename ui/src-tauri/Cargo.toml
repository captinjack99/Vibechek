[package]
name = "vibechek-desktop"
version = "0.8.0-beta"
description = "Vibechek desktop shell"
authors = ["Vibechek contributors"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-or-later"

# Library so the binary can be reused in mobile builds (Tauri 2 idiom)
[lib]
name = "vibechek_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# In-app auto-updates: downloads + verifies the signed `latest.json` produced
# by `tauri-action`. Pubkey lives in tauri.conf.json (plugins.updater.pubkey).
tauri-plugin-updater = "2"
# Needed to relaunch the app after an update is installed.
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async I/O for the sidecar pipes
tokio = { version = "1", features = ["full"] }

# Misc
anyhow = "1"

[features]
# This feature is used by `tauri-build` to build with the embedded webview.
custom-protocol = ["tauri/custom-protocol"]
