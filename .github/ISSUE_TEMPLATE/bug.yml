name: Bug report
description: Something broke. Help me reproduce + fix it.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Before you submit**: paste your `vibechek doctor` output in the diagnostics box below — it
        captures version, OS, WSL state, models, logs, and hardware in one go and saves us a back-
        and-forth.

  - type: input
    id: vibechek-version
    attributes:
      label: Vibechek version
      placeholder: "0.4.0-beta.1 (run `vibechek --version`)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (other)
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      placeholder: "I clicked X and expected Y, but got Z."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: "I expected Vibechek to..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      placeholder: |
        1. Open folder at C:\Music
        2. Click Analyze
        3. Wait 30 seconds
        4. See error toast
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: vibechek doctor output
      description: Run `vibechek doctor` in a terminal and paste the markdown here. Strips no credentials.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Additional logs (optional)
      description: If `vibechek doctor` doesn't capture what you need, paste extra log snippets here.
      render: shell
    validations:
      required: false
