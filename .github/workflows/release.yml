name: Release

# Triggered by pushing a tag like `v0.3.0`. Builds:
#   1. The PyInstaller CLI bundle (zip / tar.gz) per OS
#   2. The Tauri desktop installer per OS (.msi/.exe on Windows, .dmg on macOS,
#      .AppImage/.deb on Linux), with the CLI binary bundled as the sidecar
# All artifacts are uploaded to a draft GitHub Release for manual publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create a release

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build the Python CLI bundle on each OS (this is also the sidecar binary)
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Matrix entries marked `experimental: true` can fail without aborting
    # the downstream `release` job. Used for the Intel Mac entry while we
    # validate it across actual release runs.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `sidecar_source` is the path to the *single* PyInstaller-built
          # binary. We switched the spec to `--onefile` (see comment block in
          # packaging/vibechek.spec): one signed executable per platform, no
          # `_internal/` sibling folder to stage. This keeps Tauri's
          # externalBin contract (single-file) and macOS codesign +
          # notarization both happy.
          - os: ubuntu-latest
            asset_name: vibechek-linux-x64.tar.gz
            build_cmd: ./packaging/build-linux.sh
            artifact_glob: dist/vibechek-linux-x64.tar.gz
            sidecar_name: vibechek-sidecar-x86_64-unknown-linux-gnu
            sidecar_source: dist/vibechek
          - os: macos-latest
            asset_name: vibechek-macos-arm64.tar.gz
            build_cmd: ./packaging/build-macos.sh
            artifact_glob: dist/vibechek-macos-*.tar.gz
            sidecar_name: vibechek-sidecar-aarch64-apple-darwin
            sidecar_source: dist/vibechek
          # Intel Mac is still ~25% of the Mac market. macos-13 is GitHub's
          # last x86_64 image; without it, Intel Mac users get nothing.
          # `experimental: true` makes a failure here non-blocking — the rest
          # of the release pipeline (arm64 Mac, Windows, Linux) still ships.
          - os: macos-13
            asset_name: vibechek-macos-x64.tar.gz
            build_cmd: ./packaging/build-macos.sh
            artifact_glob: dist/vibechek-macos-*.tar.gz
            sidecar_name: vibechek-sidecar-x86_64-apple-darwin
            sidecar_source: dist/vibechek
            experimental: true
          - os: windows-latest
            asset_name: vibechek-windows-x64.zip
            build_cmd: packaging\build-windows.bat
            artifact_glob: dist/vibechek-windows-x64.zip
            sidecar_name: vibechek-sidecar-x86_64-pc-windows-msvc.exe
            sidecar_source: dist/vibechek.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Make build script executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.build_cmd }}

      - name: Build PyInstaller CLI bundle
        run: ${{ matrix.build_cmd }}

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Upload sidecar binary (for tauri job)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sidecar_name }}
          path: ${{ matrix.sidecar_source }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) Build the Tauri desktop app on each OS, with the sidecar bundled
  # ---------------------------------------------------------------------------
  build-tauri:
    name: Build desktop (${{ matrix.os }})
    needs: build-cli
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sidecar_name: vibechek-sidecar-x86_64-unknown-linux-gnu
            sidecar_dest: ui/src-tauri/binaries/vibechek-sidecar-x86_64-unknown-linux-gnu
          - os: macos-latest
            sidecar_name: vibechek-sidecar-aarch64-apple-darwin
            sidecar_dest: ui/src-tauri/binaries/vibechek-sidecar-aarch64-apple-darwin
          - os: windows-latest
            sidecar_name: vibechek-sidecar-x86_64-pc-windows-msvc.exe
            sidecar_dest: ui/src-tauri/binaries/vibechek-sidecar-x86_64-pc-windows-msvc.exe
          # Intel Mac — paired with the `macos-13` build-cli entry above so the
          # arm64 + x86_64 .dmg sit side-by-side in the release.
          - os: macos-13
            sidecar_name: vibechek-sidecar-x86_64-apple-darwin
            sidecar_dest: ui/src-tauri/binaries/vibechek-sidecar-x86_64-apple-darwin
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                              librsvg2-dev patchelf libssl-dev

      - name: Download sidecar binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sidecar_name }}
          path: ui/src-tauri/binaries

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.sidecar_dest }}

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ui
        # Codesigning + notarization (audit #5). Unsigned macOS .dmg files get
        # killed by Gatekeeper on first launch with a "can't verify" dialog
        # that most users misread as malware; unsigned Windows .exe / .msi
        # triggers Defender SmartScreen. Both are silent failures from the
        # user's POV ("sidecar died").
        #
        # The env vars below are picked up by tauri-action when present. They
        # need to be configured as GitHub repo secrets first — see
        # docs/RELEASING.md for the one-time setup walk-through. When secrets
        # are absent (as in fork CI), the env vars are empty strings and
        # tauri-action does an UNSIGNED build with a loud warning in the log.
        env:
          # macOS — requires APPLE_CERTIFICATE (.p12 base64), password, the
          # team/signing identity, plus an app-specific password for notarytool.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows — Authenticode cert via SignTool. Tauri also accepts a
          # WINDOWS_CERTIFICATE base64 + WINDOWS_CERTIFICATE_PASSWORD pair.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Collect Tauri bundles
        shell: bash
        run: |
          mkdir -p tauri-out
          # Bundle locations vary by platform; copy whatever we find
          find ui/src-tauri/target/release/bundle -maxdepth 3 -type f \
              \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \
                 -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
              -exec cp {} tauri-out/ \; || true
          ls -la tauri-out/ || true

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: vibechek-desktop-${{ matrix.os }}
          path: tauri-out/*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3) Aggregate all artifacts into a draft release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-cli, build-tauri]
    runs-on: ubuntu-latest
    # `always()` lets the release run even when an experimental matrix entry
    # (Intel Mac today) failed — we still ship whatever artifacts succeeded.
    # The `cancelled()` guard prevents a release when the workflow is cancelled.
    # `startsWith` keeps manual `workflow_dispatch` runs from publishing.
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release
          # CLI archives + Tauri bundles
          find artifacts -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \
                 -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
                 -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} release/ \;
          # Don't ship the raw sidecar binaries — they're inside the Tauri bundles
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vibechek ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release/*
          body: |
            ## Vibechek ${{ github.ref_name }}

            ML-powered DJ library organizer. Two flavors:

            ### Desktop app (recommended for most users)

            Download the installer for your platform:
            - **Windows**: `.msi` or `.exe`
            - **macOS**: `.dmg`
            - **Linux**: `.AppImage` or `.deb`

            Includes the CLI as a bundled sidecar — nothing else to install.

            ### CLI only

            For headless / scripting use, grab the `vibechek-*-x64.{zip,tar.gz}`
            archive, extract, and put the `vibechek` binary on your `PATH`.

            ### ML analysis (`vibechek analyze`)

            Install Essentia separately on Linux/macOS:

            ```
            pip install essentia-tensorflow
            vibechek download-models
            ```

            Windows: see [docs/INSTALL.md](https://github.com/papapew/Vibechek/blob/main/docs/INSTALL.md) for the WSL workaround.

            ### What's new
            <!-- generate_release_notes fills this in from commits since last tag -->
