name: Release

# Triggered by pushing a tag like `v0.2.0`. Builds the PyInstaller bundle on
# each OS, packages it (zip for Windows, tar.gz for macOS/Linux), and uploads
# everything to a GitHub Release.
#
# For an interactive run (without tagging), use the workflow_dispatch trigger.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create a release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: vibechek-linux-x64.tar.gz
            build_cmd: ./packaging/build-linux.sh
            artifact_glob: dist/vibechek-linux-x64.tar.gz
          - os: macos-latest
            asset_name: vibechek-macos-arm64.tar.gz
            build_cmd: ./packaging/build-macos.sh
            artifact_glob: dist/vibechek-macos-*.tar.gz
          - os: windows-latest
            asset_name: vibechek-windows-x64.zip
            build_cmd: packaging\build-windows.bat
            artifact_glob: dist/vibechek-windows-x64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Make build script executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.build_cmd }}

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        # download-artifact v4 puts each artifact in its own folder; collapse
        # them into a single dir so the release upload step finds them.
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vibechek ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release/*
          body: |
            ## Vibechek ${{ github.ref_name }}

            ML-powered DJ library organizer.

            ### Install
            Download the build for your platform below, extract, and run
            `vibechek` (or `vibechek.exe` on Windows). Add it to your `PATH`
            for convenience.

            For ML analysis, install Essentia separately:
            ```
            pip install essentia-tensorflow
            ```
            (Linux/macOS only — Windows users see the README.)

            ### What's new
            <!-- generate_release_notes fills this in from commits since last tag -->
