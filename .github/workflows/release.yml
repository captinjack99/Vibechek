name: Release

# Triggered by pushing a tag like `v0.3.0`. Builds:
#   1. The PyInstaller CLI bundle (zip / tar.gz) per OS
#   2. The Tauri desktop installer per OS (.msi/.exe on Windows, .dmg on macOS,
#      .AppImage/.deb on Linux), with the CLI binary bundled as the sidecar
# All artifacts are uploaded to a draft GitHub Release for manual publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create a release

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build the Python CLI bundle on each OS (this is also the sidecar binary)
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Matrix entries marked `experimental: true` can fail without aborting
    # the downstream `release` job. Used for the Intel Mac entry while we
    # validate it across actual release runs.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `sidecar_source` is the path to the *single* PyInstaller-built
          # binary. We switched the spec to `--onefile` (see comment block in
          # packaging/vibechek.spec): one signed executable per platform, no
          # `_internal/` sibling folder to stage. This keeps Tauri's
          # externalBin contract (single-file) and macOS codesign +
          # notarization both happy.
          - os: ubuntu-latest
            asset_name: vibechek-linux-x64.tar.gz
            build_cmd: ./packaging/build-linux.sh
            artifact_glob: dist/vibechek-linux-x64.tar.gz
            sidecar_name: vibechek-sidecar-x86_64-unknown-linux-gnu
            sidecar_source: dist/vibechek
          - os: macos-latest
            asset_name: vibechek-macos-arm64.tar.gz
            build_cmd: ./packaging/build-macos.sh
            artifact_glob: dist/vibechek-macos-*.tar.gz
            sidecar_name: vibechek-sidecar-aarch64-apple-darwin
            sidecar_source: dist/vibechek
          # NOTE: Intel Mac (`macos-13`) was removed from the release matrix.
          # GitHub's free-tier x86_64 macOS runners queue for a long time, and
          # because `build-tauri` / `release` use `needs: build-cli`, a queued
          # macos-13 build STALLED the entire release (incl. the Windows/Linux/
          # Apple-Silicon installers) for everyone. It was already `experimental`.
          # To re-add Intel Mac without re-introducing that bottleneck, run it
          # as a SEPARATE job that nothing `needs:` (best-effort, uploads its
          # artifact directly), or use a larger/paid runner. Tracked as a v0.5
          # follow-up.
          - os: windows-latest
            asset_name: vibechek-windows-x64.zip
            build_cmd: packaging\build-windows.bat
            artifact_glob: dist/vibechek-windows-x64.zip
            sidecar_name: vibechek-sidecar-x86_64-pc-windows-msvc.exe
            sidecar_source: dist/vibechek.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Make build script executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.build_cmd }}

      - name: Build PyInstaller CLI bundle
        run: ${{ matrix.build_cmd }}

      - name: Upload CLI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Upload sidecar binary (for tauri job)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.sidecar_name }}
          path: ${{ matrix.sidecar_source }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) Build the Tauri desktop app on each OS, with the sidecar bundled
  # ---------------------------------------------------------------------------
  build-tauri:
    name: Build desktop (${{ matrix.os }})
    needs: build-cli
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sidecar_name: vibechek-sidecar-x86_64-unknown-linux-gnu
            sidecar_dest: ui/src-tauri/binaries/vibechek-sidecar-x86_64-unknown-linux-gnu
          - os: macos-latest
            sidecar_name: vibechek-sidecar-aarch64-apple-darwin
            sidecar_dest: ui/src-tauri/binaries/vibechek-sidecar-aarch64-apple-darwin
          - os: windows-latest
            sidecar_name: vibechek-sidecar-x86_64-pc-windows-msvc.exe
            sidecar_dest: ui/src-tauri/binaries/vibechek-sidecar-x86_64-pc-windows-msvc.exe
          # Intel Mac (macos-13) removed — see the note in the build-cli matrix.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # NOTE: dtolnay/rust-toolchain has no version *tags* for its channel
      # branches — `@stable` is a moving branch that intentionally tracks the
      # latest Rust stable release. Pinning it to a commit SHA would freeze the
      # toolchain version and defeat the purpose, so it is deliberately left on
      # the `@stable` branch ref (see internal/audit-parts/fix-ci.md).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ui/src-tauri

      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                              librsvg2-dev patchelf libssl-dev

      - name: Download sidecar binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.sidecar_name }}
          path: ui/src-tauri/binaries

      - name: Stage sidecar at the externalBin name
        shell: bash
        run: |
          # The sidecar artifact was uploaded from the PyInstaller onefile
          # output `dist/vibechek` (or `vibechek.exe`), so download-artifact
          # extracts it under that ORIGINAL basename — NOT the triple-suffixed
          # name Tauri's externalBin expects. Rename it, then mark executable.
          # (Without this every desktop build fails: Unix at chmod, Windows at
          # the Tauri build's externalBin lookup.)
          cd ui/src-tauri/binaries
          dest="$(basename '${{ matrix.sidecar_dest }}')"
          if [ ! -f "$dest" ]; then
            found="$(find . -maxdepth 2 -type f -name 'vibechek*' ! -name "$dest" | head -1)"
            if [ -z "$found" ]; then
              echo "ERROR: no sidecar binary found in $(pwd)" >&2
              ls -la; exit 1
            fi
            echo "Staging sidecar: $found -> $dest"
            mv "$found" "$dest"
          fi
          if [ "$RUNNER_OS" != "Windows" ]; then chmod +x "$dest"; fi
          ls -la

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      # Code-signing is OPT-IN. CRITICAL: Tauri 2's bundler reads signing certs
      # via Rust's `std::env::var("APPLE_CERTIFICATE")`, which returns Ok("")
      # for a variable that is DEFINED BUT EMPTY. GitHub injects an unset secret
      # as an empty string, so passing `APPLE_CERTIFICATE: ${{ secrets.* }}`
      # directly in the build step's `env:` makes the bundler believe a cert is
      # present, run `security import` on empty data, and HARD-FAIL the macOS
      # bundle with:
      #   security: SecKeychainItemImport: One or more parameters ... not valid
      #   failed codesign application: failed to run command security import
      # (This is exactly the macОS release failure we hit.) The old comment here
      # wrongly assumed empty strings => unsigned build; that's only true for
      # tauri-action's JS checks, NOT the Rust bundler.
      #
      # Fix: export each signing var to $GITHUB_ENV ONLY when its secret is
      # actually non-empty. An unconfigured repo (or fork) then builds UNSIGNED
      # instead of failing; a properly-configured repo signs + notarizes. See
      # docs/RELEASING.md for the one-time secret setup.
      - name: Configure code signing (opt-in)
        shell: bash
        env:
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          IN_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # emit NAME VALUE -> append to $GITHUB_ENV only when VALUE is non-empty.
          # Heredoc form preserves multi-line base64 .p12 values intact and never
          # echoes the secret value to the log.
          emit() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              { printf '%s<<__VIBECHEK_EOF__\n' "$name"; printf '%s\n' "$value"; printf '__VIBECHEK_EOF__\n'; } >> "$GITHUB_ENV"
              echo "  $name: set"
            else
              echo "  $name: (absent)"
            fi
          }
          echo "Code-signing (opt-in — absent secrets => UNSIGNED build):"
          if [ -n "${IN_APPLE_CERTIFICATE:-}" ]; then
            echo "Apple: certificate present — macOS build will be SIGNED."
            emit APPLE_CERTIFICATE          "${IN_APPLE_CERTIFICATE:-}"
            emit APPLE_CERTIFICATE_PASSWORD "${IN_APPLE_CERTIFICATE_PASSWORD:-}"
            emit APPLE_SIGNING_IDENTITY     "${IN_APPLE_SIGNING_IDENTITY:-}"
            emit APPLE_ID                   "${IN_APPLE_ID:-}"
            emit APPLE_PASSWORD             "${IN_APPLE_PASSWORD:-}"
            emit APPLE_TEAM_ID              "${IN_APPLE_TEAM_ID:-}"
          else
            echo "Apple: no APPLE_CERTIFICATE secret — macOS build will be UNSIGNED."
          fi
          if [ -n "${IN_WINDOWS_CERTIFICATE:-}" ]; then
            echo "Windows: certificate present — Windows build will be SIGNED."
            emit WINDOWS_CERTIFICATE          "${IN_WINDOWS_CERTIFICATE:-}"
            emit WINDOWS_CERTIFICATE_PASSWORD "${IN_WINDOWS_CERTIFICATE_PASSWORD:-}"
          else
            echo "Windows: no WINDOWS_CERTIFICATE secret — Windows build will be UNSIGNED."
          fi

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          projectPath: ui
        # Signing env vars are inherited from $GITHUB_ENV (set by the step
        # above) ONLY when their secrets exist — so there is no empty-string
        # cert to trip the Tauri 2 bundler. Do NOT add APPLE_*/WINDOWS_* back
        # into this `env:` block directly; that reintroduces the empty-string
        # codesign failure documented above.

      - name: Collect Tauri bundles
        shell: bash
        run: |
          mkdir -p tauri-out
          # Bundle locations vary by platform; copy whatever we find
          find ui/src-tauri/target/release/bundle -maxdepth 3 -type f \
              \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \
                 -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
              -exec cp {} tauri-out/ \; || true
          ls -la tauri-out/ || true

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibechek-desktop-${{ matrix.os }}
          path: tauri-out/*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3) Aggregate all artifacts into a draft release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-cli, build-tauri]
    runs-on: ubuntu-latest
    # `always()` lets the release run even when an experimental matrix entry
    # (Intel Mac today) failed — we still ship whatever artifacts succeeded.
    # The `cancelled()` guard prevents a release when the workflow is cancelled.
    # `startsWith` keeps manual `workflow_dispatch` runs from publishing.
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release
          # CLI archives + Tauri bundles
          find artifacts -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \
                 -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
                 -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} release/ \;
          # Don't ship the raw sidecar binaries — they're inside the Tauri bundles
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Vibechek ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release/*
          body: |
            ## Vibechek ${{ github.ref_name }}

            ML-powered DJ library organizer. Two flavors:

            ### Desktop app (recommended for most users)

            Download the installer for your platform:
            - **Windows**: `.exe` (NSIS installer)
            - **macOS**: `.dmg` (Apple Silicon)
            - **Linux**: `.AppImage` or `.deb`

            Includes the CLI as a bundled sidecar — nothing else to install.

            > **macOS first launch (unsigned beta build):** these beta `.dmg`s are
            > not yet notarized by Apple, so Gatekeeper will refuse the first open
            > with a "Vibechek is damaged / can't be verified" message. To run it:
            > right-click **Vibechek.app → Open → Open**, or clear the quarantine
            > flag in Terminal:
            > ```
            > xattr -dr com.apple.quarantine /Applications/Vibechek.app
            > ```
            > You only need to do this once. Signed + notarized builds are planned
            > for the stable release.

            ### CLI only

            For headless / scripting use, grab the `vibechek-*-x64.{zip,tar.gz}`
            archive, extract, and put the `vibechek` binary on your `PATH`.

            ### ML analysis (`vibechek analyze`)

            Install Essentia separately on Linux/macOS:

            ```
            pip install essentia-tensorflow
            vibechek download-models
            ```

            Windows: see [docs/INSTALL.md](https://github.com/papapew/Vibechek/blob/main/docs/INSTALL.md) for the WSL workaround.

            ### What's new
            <!-- generate_release_notes fills this in from commits since last tag -->
