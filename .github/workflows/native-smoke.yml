name: Native smoke (Linux/macOS)

# The regular CI matrix already runs the [dev] unit suite on all three OSes.
# This workflow covers what that can't:
#   - the BASE runtime dependency closure (`pip install -e .`, no [dev]
#     extras) — every import on the CLI/RPC/scan path must resolve from the
#     declared runtime deps alone;
#   - the LIVE JSON-RPC sidecar loop on real Linux/macOS hardware — the exact
#     `vibechek rpc` entry the desktop shell spawns, driven end-to-end by
#     scripts/rpc_smoke.py (ping, venv probe, scan, no-engine analyze).
#
# Manual + weekly so it never blocks normal pushes. A future "full" tier can
# add the real native engine install (install_essentia_native / the ONNX
# setup) + a tiny ML analyze — kept out of round 1 so this stays fast and
# deterministic.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC

permissions:
  contents: read

jobs:
  rpc-smoke:
    name: RPC smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (BASE deps only — no [dev] extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: CLI smoke
        run: |
          vibechek --version
          vibechek system-info
          vibechek doctor

      - name: Live sidecar RPC smoke
        run: python scripts/rpc_smoke.py
