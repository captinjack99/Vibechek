name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push-burst on a PR queues 6 redundant matrix jobs without this. Cancel the
# in-flight run for the same ref before starting a new one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable, with dev deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install ffmpeg (CDJ-export fallback tests)
        # tests/test_cdj_export.py's two ffmpeg-fallback regressions
        # (canonical big-endian AIFF, and reporting a forced 44.1 kHz
        # downsample) `pytest.skip` when ffmpeg is not on PATH — so on a runner
        # image without it they are indistinguishable from passes and the
        # regressions they guard would ship green. Install it on the Linux leg
        # so they actually EXECUTE somewhere in CI; macOS/Windows keep the skip
        # rather than paying a per-run brew/choco install for the same coverage.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Lint with ruff
        # Enforcing: `ruff check` now blocks the build (E9/F bug-class lints
        # must not merge green). `ruff format` is intentionally NOT run in CI,
        # so formatting remains non-blocking.
        run: ruff check vibechek tests

      - name: Run pytest with coverage
        run: pytest -v --tb=short --cov=vibechek --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Verify generated TS types match the Python dataclasses
        # The frontend types every RPC payload off the COMMITTED generated.ts /
        # keeperConstants.ts. Without this check, editing a dataclass without
        # re-running the generator ships a frontend that type-checks cleanly
        # against a stale wire contract (a bug class this repo has already hit).
        #
        # Ordered BEFORE the README stats check: this and the CLI smoke test run
        # on this matrix cell only, and Actions stops a job at the first failing
        # step — so a stale decorative counter used to skip the wire-contract
        # gate entirely (it did, on three consecutive pushes to main).
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/generate_ts_types.py --check

      - name: Verify README stats are current
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/update_readme_stats.py --check

      - name: Smoke-test the CLI
        run: |
          vibechek --version
          vibechek --help

  rust:
    # The Tauri shell (ui/src-tauri, ~600 lines incl. the sidecar process
    # manager) previously compiled for the FIRST time inside tauri-action on
    # tag push — a Rust compile error merged green and only surfaced at
    # release time. `cargo clippy -D warnings` closes that gap the same way
    # the frontend job's tsc step does for TypeScript.
    #
    # Matrixed over every OS the release builds: clippy is a rustc driver, so
    # it only ever compiles the arms selected for ITS host. A Linux-only run
    # left sidecar.rs's `#[cfg(windows)]` PATHEXT block (the platform
    # Vibechek's users are actually on) and shell_log.rs's
    # `#[cfg(target_os = "macos")] fn data_dir` first compiled inside
    # tauri-action at TAG time — i.e. a typo there reds the release, not the PR.
    # Every legs' triple must match release.yml's `sidecar_name`, since
    # tauri-build looks the externalBin up by exact filename.
    name: Rust (Tauri shell, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sidecar: vibechek-sidecar-x86_64-unknown-linux-gnu
          - os: macos-latest
            sidecar: vibechek-sidecar-aarch64-apple-darwin
          - os: windows-latest
            sidecar: vibechek-sidecar-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same deliberate moving-branch exception as release.yml: dtolnay's
      # channel refs have no version tags; pinning a SHA would freeze the
      # toolchain and defeat the purpose.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ui/src-tauri

      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                              librsvg2-dev patchelf libssl-dev

      - name: Stage a placeholder sidecar (externalBin existence check)
        # tauri-build's build script hard-fails when the externalBin resource
        # (binaries/vibechek-sidecar-<triple>) is absent — true on every clean
        # checkout, since the real sidecar is only built by the release
        # workflow's build-cli job. Clippy never executes the binary, so an
        # empty file satisfies the check. The name is per-triple (matrix), and
        # bash is available on the Windows runner too.
        shell: bash
        run: |
          mkdir -p ui/src-tauri/binaries
          touch "ui/src-tauri/binaries/${{ matrix.sidecar }}"

      - name: cargo clippy (deny warnings)
        working-directory: ui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: ui
        run: ./node_modules/.bin/tsc --noEmit
        # Enforcing: tsc is clean as of v0.4.0-beta.6. This is the guard that
        # would have caught the release-breaking build failure (a failing
        # `tsc --noEmit` makes tauri-action's `beforeBuildCommand: npm run
        # build` abort, killing every desktop build).

      - name: Run vitest
        working-directory: ui
        run: npm test

      - name: Production build smoke test
        working-directory: ui
        run: npm run build
        # Enforcing: mirrors tauri-action's beforeBuildCommand. If `npm run
        # build` fails here, the release's desktop builds would fail too — so
        # block the PR/commit instead of discovering it only on tag push.
